<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Simple Invoice Generator</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4376df" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4376df;
      --primary-dark: #3349b8;
      --accent: #5e60ce;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 8px 20px rgba(15, 23, 42, 0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        sans-serif;
      background: radial-gradient(circle at top, #1d2a4a 0, #020617 55%);
      min-height: 100vh;
      padding: 16px;
      color: var(--text-main);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 960px;
      margin: auto;
      background: linear-gradient(
          135deg,
          rgba(67, 118, 223, 0.08),
          rgba(94, 96, 206, 0.08)
        ),
        #020617;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.3);
      backdrop-filter: blur(18px);
    }

    .success-banner {
      background: var(--success);
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-weight: 500;
      display: none;
      font-size: 14px;
    }

    .success-banner.active {
      display: block;
    }

    .success-banner button {
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      margin-left: 8px;
      cursor: pointer;
    }

    .header {
      background: radial-gradient(circle at top left, #60a5fa, #4f46e5);
      color: white;
      padding: 24px 24px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-main {
      max-width: 70%;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.03em;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .header-meta {
      text-align: right;
      font-size: 12px;
      opacity: 0.9;
    }

    .header-meta span {
      display: block;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr);
      gap: 0;
      background: radial-gradient(circle at top, #0b1120, #020617);
      color: #e5e7eb;
    }

    @media (max-width: 800px) {
      .content {
        grid-template-columns: minmax(0, 1fr);
      }
      .header-main {
        max-width: 100%;
      }
      .header {
        padding: 20px 18px 14px;
      }
    }

    .panel {
      padding: 20px 22px 24px;
      background: rgba(15, 23, 42, 0.9);
    }

    .panel + .panel {
      border-left: 1px solid rgba(148, 163, 184, 0.35);
    }

    @media (max-width: 800px) {
      .panel + .panel {
        border-left: none;
        border-top: 1px solid rgba(148, 163, 184, 0.35);
      }
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-grid {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    .form-grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 640px) {
      .form-grid.cols-2 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label span.hint {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
    }

    input,
    textarea,
    select {
      padding: 10px 11px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.18s ease;
      font-family: inherit;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
    }

    input::placeholder,
    textarea::placeholder {
      color: #6b7280;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.7);
      background: rgba(15, 23, 42, 0.95);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .items-container {
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      padding: 12px;
      background: radial-gradient(circle at top left, #020617, #020617);
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .item-row {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 0.9fr) minmax(
          0,
          1fr
        ) 40px;
      gap: 8px;
      margin-bottom: 10px;
      align-items: end;
    }

    @media (max-width: 640px) {
      .item-row {
        grid-template-columns: minmax(0, 1fr);
        padding: 10px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.9);
      }
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.45);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .btn-secondary:hover {
      background: rgba(30, 64, 175, 0.7);
    }

    .btn-small {
      padding: 7px 11px;
      font-size: 12px;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.95);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    .btn-danger:hover {
      background: rgba(220, 38, 38, 0.95);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .invoice-preview {
      background: #f9fafb;
      border-radius: 12px;
      padding: 18px 18px 20px;
      max-height: 520px;
      overflow-y: auto;
      color: #0f172a;
      border: 1px solid #e5e7eb;
    }

    .invoice-preview.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 13px;
      text-align: center;
      padding: 40px 20px;
    }

    .invoice-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--primary);
    }

    .invoice-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.12em;
    }

    .invoice-number {
      text-align: right;
      font-size: 13px;
    }

    .invoice-logo {
      max-width: 120px;
      max-height: 60px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .invoice-details {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 18px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .invoice-details {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .detail-block h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .detail-block p {
      color: #111827;
      line-height: 1.5;
      white-space: pre-line;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .items-table th {
      background: #f3f4f6;
      padding: 8px 8px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }

    .items-table td {
      padding: 8px 8px;
      border-bottom: 1px solid #e5e7eb;
      color: #111827;
      vertical-align: top;
    }

    .items-table .text-right {
      text-align: right;
    }

    .totals {
      margin-left: auto;
      width: 260px;
      font-size: 13px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }

    .total-row.grand-total {
      border-top: 2px solid var(--primary);
      margin-top: 6px;
      padding-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .notes-section {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #d1d5db;
      font-size: 12px;
    }

    .notes-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    .notes-section p {
      color: #374151;
      line-height: 1.5;
      white-space: pre-line;
    }

    .print-actions {
      padding: 10px 22px 18px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .print-actions-left {
      font-size: 11px;
      color: #9ca3af;
    }

    .print-actions-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .editable-hint {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .editable {
      cursor: text;
    }

    .editable:focus {
      outline: 1px dashed #9ca3af;
      outline-offset: 2px;
      background: #fefce8;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }
      .app-shell {
        box-shadow: none;
        border-radius: 0;
        border: none;
      }
      .header,
      .panel:first-of-type,
      .print-actions {
        display: none !important;
      }
      .panel:last-of-type {
        padding: 0;
      }
      .invoice-preview {
        max-height: none;
        border: none;
        border-radius: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="success-banner" id="successBanner">
      Draft saved locally
      <button type="button" onclick="hideBanner()">×</button>
    </div>

    <header class="header">
      <div class="header-main">
        <h1>Invoice Generator</h1>
        <p>Create professional invoices instantly — offline‑ready, auto‑numbered, and reusable.</p>
      </div>
      <div class="header-meta">
        <span id="appVersion">v2026.1</span>
        <span id="pwaStatus">Offline‑capable</span>
      </div>
    </header>

    <main class="content">
      <!-- LEFT: FORM -->
      <section class="panel" id="formSection">
        <div class="section-title">Your Business</div>
        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="businessName">
              Business Name *
            </label>
            <input
              type="text"
              id="businessName"
              required
              placeholder="Your Company Name"
            />
          </div>
          <div class="form-group">
            <label for="businessContact">
              Contact Info
              <span class="hint">Email or phone</span>
            </label>
            <input
              type="text"
              id="businessContact"
              placeholder="you@example.com · (555) 555‑5555"
            />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="businessAddress">Business Address</label>
            <textarea
              id="businessAddress"
              placeholder="123 Main St&#10;City, Province&#10;Postal Code"
            ></textarea>
          </div>
        </div>

        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="logoInput">
              Logo
              <span class="hint">Optional · PNG/JPEG</span>
            </label>
            <input type="file" id="logoInput" accept="image/*" />
          </div>
          <div class="form-group">
            <label for="currency">
              Currency
            </label>
            <select id="currency">
              <option value="$">$ USD</option>
              <option value="CAD $">CAD $</option>
              <option value="€">€ EUR</option>
              <option value="£">£ GBP</option>
            </select>
          </div>
        </div>

        <div class="section-title">Client & Invoice</div>
        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="clientName">Client Name *</label>
            <input
              type="text"
              id="clientName"
              required
              placeholder="Client Company or Name"
            />
          </div>
          <div class="form-group">
            <label for="invoiceNumber">
              Invoice Number *
              <span class="hint" id="autoNumberHint">Auto‑numbered</span>
            </label>
            <input type="text" id="invoiceNumber" required />
          </div>
        </div>

        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="invoiceDate">Invoice Date *</label>
            <input type="date" id="invoiceDate" required />
          </div>
          <div class="form-group">
            <label for="dueDate">
              Due Date
              <span class="hint">Optional</span>
            </label>
            <input type="date" id="dueDate" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="clientAddress">Client Address</label>
            <textarea
              id="clientAddress"
              placeholder="Client address"
            ></textarea>
          </div>
        </div>

        <div class="section-title">Items / Services</div>
        <div class="items-container" id="itemsContainer"></div>
        <div class="actions">
          <button class="btn btn-secondary btn-small" type="button" onclick="addItem()">
            + Add Item
          </button>
          <button class="btn btn-secondary btn-small" type="button" onclick="clearItems()">
            Clear Items
          </button>
        </div>

        <div class="section-title" style="margin-top: 18px;">Totals</div>
        <div class="form-grid cols-2">
          <div class="form-group">
            <label for="discount">
              Discount
              <span class="hint">Amount or % (e.g. 50 or 10%)</span>
            </label>
            <input
              type="text"
              id="discount"
              placeholder="0 or 10%"
            />
          </div>
          <div class="form-group">
            <label for="taxRate">
              Tax Rate
              <span class="hint">Percent (e.g. 5)</span>
            </label>
            <input
              type="number"
              id="taxRate"
              min="0"
              step="0.01"
              placeholder="0"
            />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="notes">
              Notes / Payment Terms
            </label>
            <textarea
              id="notes"
              placeholder="Thank you for your business!&#10;Payment due within 30 days."
            ></textarea>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn btn-secondary btn-small" type="button" onclick="loadDraft()">
